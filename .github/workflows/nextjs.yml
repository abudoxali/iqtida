# GitHub Pages is the wrong host for this repository.
#
# The Next.js app lives in iqtida/, not the repo root. The previous workflow
# looked for yarn.lock or package.json in the repository root and failed
# package-manager detection (Actions run 29448637746).
#
# Fixing that path would still be wrong. iqtida/ is a Node server: App Router
# route handlers, Server Actions, NextAuth with the Prisma adapter, and
# PostgreSQL. GitHub Pages only serves static files. Do not set
# output: 'export' and do not remove auth, API routes, or Prisma to make a
# Pages deploy pass. See docs/DEPLOYMENT.md.
#
# This workflow is manual-only so pushes to main no longer fail. It does not
# install, build, or deploy.

name: GitHub Pages (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  not-deployed:
    runs-on: ubuntu-latest
    steps:
      - name: Do not deploy
        run: |
          echo "GitHub Pages deployment is disabled."
          echo "Host iqtida/ on a Node server with managed Postgres."
          echo "See docs/DEPLOYMENT.md."
